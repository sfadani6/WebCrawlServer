<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로세스 로그 - WebCrawlServer</title>
    <link rel="stylesheet" href="../../../css/styles.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="admin-console-body">

    <!-- 상단 앱 바 -->
    <header class="console-topbar">
        <div class="console-brand">
            <button class="console-icon-button mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="관리 메뉴 열기">☰</button>
            <a href="/admin" class="console-logo" aria-label="관리자 대시보드로 이동">
                <span class="console-logo-mark">W</span>
                <span class="console-logo-text">WebCrawlServer</span>
            </a>
        </div>
        <form class="console-search" role="search">
            <label class="sr-only" for="adminSearch">관리 기능 검색</label>
            <input id="adminSearch" type="search" placeholder="관리 기능, 로그, 프로세스 검색">
        </form>
        <div class="console-topbar-actions">
            <a href="/" class="btn btn-secondary btn-sm">메인</a>
            <button class="console-icon-button" type="button" aria-label="도움말">?</button>
            <button class="console-avatar" type="button" aria-label="관리자 계정">관</button>
        </div>
    </header>

    <div class="console-shell">
        <!-- 모바일 사이드바 오버레이 -->
        <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()" aria-hidden="true"></div>

        <!-- 좌측 사이드바 -->
        <aside class="console-sidebar" id="main-nav" aria-label="관리자 주요 메뉴">
            <nav class="console-sidebar-nav">
                <a class="console-nav-link" href="/admin"><span>대시보드</span></a>
                <a class="console-nav-link" href="/admin/process"><span>프로세스</span></a>
                <a class="console-nav-link" href="/admin/process/logs"><span>프로세스 로그</span></a>
                <a class="console-nav-link" href="/admin/database"><span>데이터베이스</span></a>
                <a class="console-nav-link" href="/admin/modules"><span>모듈</span></a>
                <a class="console-nav-link" href="/admin/workflows"><span>워크플로우</span></a>
                <a class="console-nav-link" href="/admin/scheduler"><span>스케줄러</span></a>
                <a class="console-nav-link" href="/admin/logs"><span>로그</span></a>
                <a class="console-nav-link" href="/admin/settings"><span>설정</span></a>
            </nav>
        </aside>

        <!-- 본문 -->
        <main class="console-main">
            <!-- 브레드크럼 -->
            <nav class="console-breadcrumb" aria-label="현재 위치">
                <a href="/admin">관리자</a>
                <span aria-hidden="true">/</span>
                <a href="/admin/process">프로세스</a>
                <span aria-hidden="true">/</span>
                <span>로그</span>
            </nav>

            <!-- 페이지 헤더 -->
            <section class="console-hero">
                <div>
                    <p class="console-eyebrow">서버 관리</p>
                    <h1>프로세스 로그</h1>
                    <p class="admin-page-subtitle">서버 로그 파일 목록 및 내용을 확인합니다.</p>
                </div>
                <div class="console-hero-actions">
                    <button class="btn btn-secondary btn-sm" onclick="refreshLogList()">목록 새로고침</button>
                    <button class="btn btn-secondary btn-sm" onclick="clearAllLogs()">모두 삭제</button>
                </div>
            </section>

            <!-- 알림 컨테이너 -->
            <div id="alert-container" class="mb-md"></div>

            <div class="console-content-grid">
                <!-- 로그 파일 목록 -->
                <section class="admin-section console-panel console-panel-wide">
                    <div class="admin-section-header">
                        <h2>로그 파일 목록</h2>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <select id="log-type-filter" class="form-control" style="width:auto;min-width:120px;" onchange="filterLogs()">
                                <option value="">전체 타입</option>
                                <option value="server">서버 로그</option>
                                <option value="activity">액티비티</option>
                                <option value="error">에러 로그</option>
                                <option value="websocket">WebSocket</option>
                            </select>
                            <input type="search" id="log-search" class="form-control" style="width:180px;" placeholder="로그 검색..." oninput="filterLogs()">
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr><th>파일명</th><th>타입</th><th>크기</th><th>마지막 수정</th><th>액션</th></tr>
                            </thead>
                            <tbody id="log-file-list">
                                <tr><td colspan="5" class="text-center">로그 파일 목록을 불러오는 중...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 필터 현황 -->
                <section class="admin-section console-panel">
                    <div class="admin-section-header"><h2>필터 현황</h2></div>
                    <div class="console-status-list status-grid">
                        <div class="status-item">
                            <div class="status-item-header"><span class="status-indicator online"></span><span>선택 타입</span></div>
                            <span class="status-value" id="filter-type-display">전체</span>
                        </div>
                        <div class="status-item">
                            <div class="status-item-header"><span class="status-indicator online"></span><span>검색어</span></div>
                            <span class="status-value" id="filter-query-display">없음</span>
                        </div>
                        <div class="status-item">
                            <div class="status-item-header"><span class="status-indicator online"></span><span>표시 파일 수</span></div>
                            <span class="status-value" id="filter-count-display">-</span>
                        </div>
                    </div>
                </section>

                <!-- 로그 내용 -->
                <section class="admin-section console-panel console-panel-wide">
                    <div class="admin-section-header">
                        <h2>로그 내용</h2>
                        <button class="btn btn-secondary btn-sm" onclick="refreshLogContent()">새로고침</button>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr><th>#</th><th>시간</th><th>레벨</th><th>메시지</th></tr>
                            </thead>
                            <tbody id="log-content-list">
                                <tr><td colspan="4" class="text-center">로그 내용을 불러오는 중...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="log-pagination"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- 로그 파일 보기 모달 -->
    <div id="log-view-modal" class="admin-modal hidden" role="dialog" aria-hidden="true">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h2 id="log-view-title">로그 파일 내용</h2>
                <button class="admin-modal-close" onclick="closeLogView()">&times;</button>
            </div>
            <div class="admin-modal-body">
                <div style="display:flex;gap:16px;margin-bottom:12px;font-size:13px;color:#5f6368;">
                    <span>파일: <strong id="viewing-file-name">-</strong></span>
                    <span>크기: <strong id="viewing-file-size">-</strong></span>
                    <span>줄 수: <strong id="viewing-file-lines">-</strong></span>
                </div>
                <div class="table-container">
                    <div id="log-content" style="font-family:monospace;font-size:12px;white-space:pre;overflow-x:auto;max-height:400px;overflow-y:auto;background:#f8fafd;padding:12px;border-radius:8px;border:1px solid #dadce0;"></div>
                </div>
            </div>
            <div class="admin-modal-footer">
                <button class="btn btn-secondary" onclick="downloadLogFile()">다운로드</button>
                <button class="btn btn-primary" onclick="closeLogView()">닫기</button>
            </div>
        </div>
    </div>

    <script src="../../../js/main.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
        var currentLogPage = 1;
        var itemsPerPage = 20;
        var currentFile = null;
        var allLogFiles = [
            { name: 'server.log',    type: '서버 로그',    typeClass: 'info',    size: '15.2 KB', modified: '2026-07-25 14:30:00' },
            { name: 'websocket.log', type: 'WebSocket',    typeClass: 'info',    size: '89.5 KB', modified: '2026-07-25 14:15:00' },
            { name: 'error.log',     type: '에러 로그',    typeClass: 'error',   size: '3.1 KB',  modified: '2026-07-25 14:00:00' },
            { name: 'access.log',    type: '액세스 로그',  typeClass: 'success', size: '28.7 KB', modified: '2026-07-25 14:28:00' }
        ];
        var allLogContent = [
            { id:1, time:'2026-07-25 14:30:00', level:'INFO',  levelClass:'success', message:'서버가 포트 9600에서 시작되었습니다.' },
            { id:2, time:'2026-07-25 14:29:00', level:'INFO',  levelClass:'success', message:'데이터베이스 연결 성공' },
            { id:3, time:'2026-07-25 14:28:00', level:'INFO',  levelClass:'success', message:'WebSocket 서버 시작' },
            { id:4, time:'2026-07-25 14:27:00', level:'WARN',  levelClass:'warning', message:'스케줄러 작업이 지연되고 있습니다.' },
            { id:5, time:'2026-07-25 14:25:00', level:'ERROR', levelClass:'error',   message:'모듈 로드 실패: missing_module' },
            { id:6, time:'2026-07-25 14:20:00', level:'INFO',  levelClass:'success', message:'MCP 서버 준비 완료' }
        ];

        // 사이드바 활성 링크 자동 감지
        domReady(function() {
            var currentPath = window.location.pathname;
            document.querySelectorAll('.console-nav-link').forEach(function(link) {
                var href = link.getAttribute('href');
                if (href && href !== '/admin' && currentPath === href) link.classList.add('active');
            });
            updateLogFileList(allLogFiles);
            updateLogContent(allLogContent);
            updateFilterStatus();
        });

        function toggleMobileMenu() {
            document.getElementById('main-nav').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }
        function closeSidebar() {
            document.getElementById('main-nav').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('open');
        }

        function updateLogFileList(files) {
            var container = document.getElementById('log-file-list');
            if (!files.length) { container.innerHTML = '<tr><td colspan="5" class="text-center">로그 파일이 없습니다.</td></tr>'; return; }
            container.innerHTML = files.map(function(f) {
                return '<tr>' +
                    '<td>' + f.name + '</td>' +
                    '<td><span class="badge badge-' + f.typeClass + '">' + f.type + '</span></td>' +
                    '<td>' + f.size + '</td>' +
                    '<td>' + f.modified + '</td>' +
                    '<td style="display:flex;gap:4px;">' +
                        '<a href="#" class="btn btn-secondary btn-sm" onclick="viewLogContent(\'' + f.name + '\');return false;">보기</a>' +
                        '<button class="btn btn-danger btn-sm" onclick="deleteLogFile(\'' + f.name + '\')">삭제</button>' +
                    '</td>' +
                '</tr>';
            }).join('');
            document.getElementById('filter-count-display').textContent = files.length + '개';
        }

        function updateLogContent(logs) {
            var container = document.getElementById('log-content-list');
            var start = (currentLogPage - 1) * itemsPerPage;
            var slice = logs.slice(start, start + itemsPerPage);
            if (!slice.length) { container.innerHTML = '<tr><td colspan="4" class="text-center">로그가 없습니다.</td></tr>'; return; }
            container.innerHTML = slice.map(function(l) {
                return '<tr><td>' + l.id + '</td><td>' + l.time + '</td>' +
                    '<td><span class="badge badge-' + l.levelClass + '">' + l.level + '</span></td>' +
                    '<td>' + l.message + '</td></tr>';
            }).join('');
            buildPagination(logs.length);
        }

        function buildPagination(total) {
            var totalPages = Math.ceil(total / itemsPerPage);
            var pagination = document.getElementById('log-pagination');
            var html = '';
            if (currentLogPage > 1) html += '<button onclick="goToPage(' + (currentLogPage-1) + ')">이전</button>';
            for (var i = Math.max(1, currentLogPage-2); i <= Math.min(totalPages, currentLogPage+2); i++) {
                html += '<button class="' + (i===currentLogPage?'active':'') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
            }
            if (currentLogPage < totalPages) html += '<button onclick="goToPage(' + (currentLogPage+1) + ')">다음</button>';
            pagination.innerHTML = html;
        }

        function goToPage(page) { currentLogPage = page; updateLogContent(allLogContent); }

        function filterLogs() {
            var typeFilter  = document.getElementById('log-type-filter').value;
            var searchQuery = document.getElementById('log-search').value.toLowerCase();
            var filtered    = allLogFiles.filter(function(f) {
                var typeMatch   = !typeFilter || f.name.includes(typeFilter) || f.type.includes(typeFilter);
                var searchMatch = !searchQuery || f.name.toLowerCase().includes(searchQuery);
                return typeMatch && searchMatch;
            });
            updateLogFileList(filtered);
            updateFilterStatus();
        }

        function updateFilterStatus() {
            var typeFilter  = document.getElementById('log-type-filter').value;
            var searchQuery = document.getElementById('log-search').value;
            document.getElementById('filter-type-display').textContent  = typeFilter  || '전체';
            document.getElementById('filter-query-display').textContent = searchQuery || '없음';
        }

        function refreshLogList()    { updateLogFileList(allLogFiles); showAlert('info', '목록이 새로고침되었습니다.', 2000); }
        function refreshLogContent() { updateLogContent(allLogContent); showAlert('info', '로그 내용이 새로고침되었습니다.', 2000); }

        function viewLogContent(fileName) {
            currentFile = fileName;
            document.getElementById('log-view-title').textContent    = fileName + ' — 로그 파일 내용';
            document.getElementById('viewing-file-name').textContent  = fileName;
            var info = allLogFiles.find(function(f) { return f.name === fileName; }) || {};
            document.getElementById('viewing-file-size').textContent  = info.size  || '-';
            document.getElementById('viewing-file-lines').textContent = '50 줄';
            var lines = [];
            for (var i = 1; i <= 50; i++) {
                var levels = ['INFO','WARN','ERROR','DEBUG'];
                var msgs   = ['서버 동작 정상','클라이언트 연결됨','쿼리 실행 성공','파일 읽기 완료','Timeout 발생','연결 종료됨'];
                lines.push('[2026-07-25 14:' + String(Math.floor(Math.random()*60)).padStart(2,'0') + ':00] [' +
                    levels[Math.floor(Math.random()*levels.length)] + '] ' +
                    msgs[Math.floor(Math.random()*msgs.length)]);
            }
            document.getElementById('log-content').textContent = lines.join('\n');
            var modal = document.getElementById('log-view-modal');
            modal.classList.remove('hidden');
            modal.setAttribute('aria-hidden','false');
        }

        function closeLogView() {
            var modal = document.getElementById('log-view-modal');
            modal.classList.add('hidden');
            modal.setAttribute('aria-hidden','true');
        }

        function deleteLogFile(fileName) {
            if (confirm('정말로 "' + fileName + '" 파일을 삭제하시겠습니까?'))
                showAlert('success', fileName + ' 파일이 삭제되었습니다.', 3000);
        }

        function clearAllLogs() {
            if (confirm('정말로 모든 로그 파일을 삭제하시겠습니까?'))
                showAlert('success', '모든 로그 파일이 삭제되었습니다.', 3000);
        }

        function downloadLogFile() {
            if (currentFile) showAlert('info', currentFile + ' 파일 다운로드가 준비되었습니다.', 3000);
        }
    </script>
</body>
</html>
